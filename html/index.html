<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jangan stres UAS</title>
    <style>
        /* ==========================================================================
           1. RESET & LAYOUT BASE
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: #0f172a; /* Warna dasar gelap jika loading lambat */
        }

        /* ==========================================================================
           2. ANIMASI BACKGROUND GRADASI (Z-INDEX: -1)
           ========================================================================== */
        .bg-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: -1; /* Berada di paling belakang */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ==========================================================================
           3. KOTAK KONTEN / CARD (POSITION RELATIVE & Z-INDEX 1)
           ========================================================================== */
        .card {
            position: relative;
            z-index: 1; /* Maju ke depan biar bisa diklik tombolnya */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 600px;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px); /* Efek melayang halus saat didekati kursor */
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .footer-text {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-bottom: 1.5rem;
        }

        /* ==========================================================================
           4. TOMBOL INTERAKTIF
           ========================================================================== */
        button {
            background: white;
            color: #e73c7e;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            background: #f8fafc;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Efek Background Bergerak -->
    <div class="bg-animation"></div>

    <!-- Kotak Konten Utama -->
    <div class="card">
        <h1>AZZA JORE🎉</h1>
        <p class="subtitle">Ujian Akhir Semester Genap - Kelas Sentul</p>
        <p class="footer-text">STMIK Tazkia - Kombinasi SO & Jaringan Komputer</p>
        
        <!-- Tombol buat Confetti -->
        <button id="confettiBtn">Rayakan Lagi! 🥳</button>
    </div>

    <!-- Library Confetti via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Script Custom Internal -->
    <script>
        // Fungsi untuk menembakkan konfeti
        function lemparConfetti() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // Tembak otomatis saat web selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            lemparConfetti();
        });

        // Tembak saat tombol diklik
        document.getElementById('confettiBtn').addEventListener('click', () => {
            lemparConfetti();
        });
    </script>
</body>
</html>
