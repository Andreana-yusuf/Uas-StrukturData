<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jangan stres UAS - DUGEM EDITION</title>
    <style>
        /* ============================================================
           1. RESET & BASE STYLES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Latar belakang hitam pekat agar neon kontras */
            background: #000; 
        }

        /* ============================================================
           2. ANIMASI LAMPU DUGEM (KUNCI UTAMA)
           ============================================================ */

        /* Definisi perubahan warna kilat dengan efek pendaran (glow) */
        @keyframes dugemStrobe {
            0%, 100% { 
                background-color: #ff00ff; /* Pink Neon */
                box-shadow: 0 0 60px 20px #ff00ff; 
            }
            20% { 
                background-color: #00ffff; /* Cyan Neon */
                box-shadow: 0 0 60px 20px #00ffff; 
            }
            40% { 
                background-color: #ff0000; /* Merah Neon */
                box-shadow: 0 0 60px 20px #ff0000; 
            }
            60% { 
                background-color: #00ff00; /* Hijau Neon */
                box-shadow: 0 0 60px 20px #00ff00; 
            }
            80% { 
                background-color: #ffff00; /* Kuning Neon */
                box-shadow: 0 0 60px 20px #ffff00; 
            }
        }

        /* Elemen background yang menjalankan animasi */
        .bg-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Kecepatan 0.3s (SANGAT CEPAT) untuk efek strobe dugem */
            animation: dugemStrobe 0.3s infinite linear !important;
            z-index: -1; /* Di belakang card */
            opacity: 0.9; /* Biar warnanya nendang banget */
        }

        /* ============================================================
           3. KOTAK KONTEN (CARD) - TETAP SAMA
           ============================================================ */
        .card {
            position: relative;
            z-index: 1; /* Di depan background */
            /* Efek buram (glassmorphism) */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            max-width: 90%;
            width: 600px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .footer-text {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        /* ============================================================
           4. TOMBOL - DENGAN EFEK GLOW
           ============================================================ */
        button {
            background: white;
            color: #333;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            background: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <!-- Efek Background Lampu Dugem -->
    <div class="bg-animation"></div>

    <!-- Kotak Konten Utama -->
    <div class="card">
        <h1>AZZA JORE🎉</h1>
        <p class="subtitle">Ujian Akhir Semester Genap - Kelas Sentul</p>
        <p class="footer-text">STMIK Tazkia - Kombinasi SO & Jaringan Komputer</p>
        
        <!-- Tombol buat Confetti -->
        <button id="confettiBtn">Rayakan Lagi! 🥳</button>
    </div>

    <!-- Library Confetti via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Script Custom Internal -->
    <script>
        // Fungsi untuk menembakkan konfeti
        function lemparConfetti() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // Tembak otomatis saat web selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            lemparConfetti();
        });

        // Tembak saat tombol diklik
        document.getElementById('confettiBtn').addEventListener('click', () => {
            lemparConfetti();
        });
    </script>
</body>
</html>
